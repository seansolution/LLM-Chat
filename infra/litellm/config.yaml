# LiteLLM Gateway Config (LM Studio on LAN)
model_list:
  - model_name: qwen3
    litellm_params:
      model: openai/nvidia/nemotron-3-nano-4b
      api_base: http://192.168.250.9:1234/v1
      api_key: "lm-studio"

  - model_name: gemma3-vision
    litellm_params:
      model: openai/google/gemma-3-4b
      api_base: http://192.168.250.9:1234/v1
      api_key: "lm-studio"

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-nomic-embed-text-v1.5
      api_base: http://192.168.250.9:1234/v1
      api_key: "lm-studio"

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120

litellm_settings:
  drop_params: true
  set_verbose: false
  success_callback: []
  failure_callback: []

general_settings:
  master_key: "sk-litellm-master"
