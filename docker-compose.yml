version: "3.9"

# ============================================================
# Enterprise RAG Platform — Apple Silicon (M1/M2/M3/M4) build
# All images are arm64-native or run via Rosetta 2 where noted.
# vLLM is replaced by Ollama (runs natively on Apple Silicon MPS).
# ============================================================

networks:
  rag-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  opensearch_data:
  hugegraph_data:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  nats_data:
  langfuse_data:
  prometheus_data:
  grafana_data:
  authentik_data:

services:

  # ─────────────────────────────────────────────
  # PostgreSQL — arm64 native
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Qdrant — arm64 native
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    platform: linux/arm64
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────
  # OpenSearch — arm64 native (2.x supports arm64)
  # Note: vm.max_map_count cannot be set on macOS;
  #       bootstrap.system_call_filter=false disables the check.
  # ─────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    platform: linux/arm64
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=false
      - bootstrap.system_call_filter=false
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────────
  # HugeGraph — no arm64 image; runs via Rosetta 2
  # platform: linux/amd64 triggers Rosetta on M-series
  # ─────────────────────────────────────────────
  hugegraph:
    image: hugegraph/hugegraph:1.3.0
    platform: linux/amd64   # Rosetta 2 emulation on Apple Silicon
    restart: unless-stopped
    environment:
      - hugegraph.backend=rocksdb
    volumes:
      - hugegraph_data:/hugegraph/data
    ports:
      - "8080:8080"
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/apis/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────────
  # SeaweedFS — arm64 native
  # Note: filer uses port 8889 to avoid conflict with volume (8888)
  # ─────────────────────────────────────────────
  seaweedfs-master:
    image: chrislusf/seaweedfs:3.68
    platform: linux/arm64
    restart: unless-stopped
    command: master -mdir=/data -ip=seaweedfs-master
    volumes:
      - seaweedfs_master_data:/data
    ports:
      - "9333:9333"
    networks: [rag-net]

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.68
    platform: linux/arm64
    restart: unless-stopped
    command: volume -mserver=seaweedfs-master:9333 -dir=/data -ip=seaweedfs-volume -port=8888
    volumes:
      - seaweedfs_volume_data:/data
    ports:
      - "8888:8888"
    networks: [rag-net]
    depends_on: [seaweedfs-master]

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.68
    platform: linux/arm64
    restart: unless-stopped
    command: filer -master=seaweedfs-master:9333 -port=8889
    ports:
      - "8889:8889"
    networks: [rag-net]
    depends_on: [seaweedfs-master, seaweedfs-volume]

  # ─────────────────────────────────────────────
  # NATS JetStream — arm64 native
  # ─────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    platform: linux/arm64
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Authentik — arm64 native (goauthentik supports arm64)
  # ─────────────────────────────────────────────
  authentik-db:
    image: postgres:16-alpine
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentikpassword
      POSTGRES_DB: authentik
    volumes:
      - authentik_data:/var/lib/postgresql/data
    networks: [rag-net]

  authentik-redis:
    image: redis:7-alpine
    platform: linux/arm64
    restart: unless-stopped
    networks: [rag-net]

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.4.2
    platform: linux/arm64
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentikpassword
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-in-production-32chars!!}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    ports:
      - "9000:9000"
      - "9443:9443"
    networks: [rag-net]
    depends_on: [authentik-db, authentik-redis]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.4.2
    platform: linux/arm64
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentikpassword
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-in-production-32chars!!}
    networks: [rag-net]
    depends_on: [authentik-db, authentik-redis]

  # ─────────────────────────────────────────────
  # LiteLLM — LLM gateway → LM Studio on host
  # LM Studio must be running on the host at port 1234
  # with Qwen3.5-9B-Q4_K_M loaded as the active model.
  # ─────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.40.10
    platform: linux/arm64
    restart: unless-stopped
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    networks: [rag-net]
    # Allows containers to reach host LM Studio via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-local-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-dummy-local-key}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-dummy-local-key}
      - XAI_API_KEY=${XAI_API_KEY:-dummy-local-key}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-dummy-local-key}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-dummy-local-key}
      - GROQ_API_KEY=${GROQ_API_KEY:-dummy-local-key}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Langfuse — arm64 native (Next.js-based, multi-arch)
  # ─────────────────────────────────────────────
  langfuse-db:
    image: postgres:16-alpine
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfusepassword
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    networks: [rag-net]

  langfuse:
    image: langfuse/langfuse:2.81.2
    platform: linux/arm64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://langfuse:langfusepassword@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-production}
      SALT: ${LANGFUSE_SALT:-change-me-in-production}
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"
    networks: [rag-net]
    depends_on: [langfuse-db]

  # ─────────────────────────────────────────────
  # Prometheus — arm64 native
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    platform: linux/arm64
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [rag-net]

  # ─────────────────────────────────────────────
  # Grafana — arm64 native
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    platform: linux/arm64
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    networks: [rag-net]
    depends_on: [prometheus]

  # ─────────────────────────────────────────────
  # FastAPI Backend — built for linux/arm64
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://rag_app:ragapppassword@postgres:5432/ragdb
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      HUGEGRAPH_URL: http://hugegraph:8080
      NATS_URL: nats://nats:4222
      SEAWEEDFS_FILER_URL: http://seaweedfs-filer:8889
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master}
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      AUTHENTIK_URL: http://authentik-server:9000
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-rag-backend}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "8001:8001"
    networks: [rag-net]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      nats:
        condition: service_healthy
      litellm:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # BGM Workers — same arm64 image as backend
  # ─────────────────────────────────────────────
  worker-embedder:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    restart: unless-stopped
    command: ["python", "-m", "workers.embedder"]
    environment:
      DATABASE_URL: postgresql+asyncpg://rag_app:ragapppassword@postgres:5432/ragdb
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      NATS_URL: nats://nats:4222
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master}
    networks: [rag-net]
    depends_on: [postgres, qdrant, nats, litellm]

  worker-parser:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    restart: unless-stopped
    command: ["python", "-m", "workers.parser"]
    environment:
      DATABASE_URL: postgresql+asyncpg://rag_app:ragapppassword@postgres:5432/ragdb
      NATS_URL: nats://nats:4222
      SEAWEEDFS_FILER_URL: http://seaweedfs-filer:8889
    networks: [rag-net]
    depends_on: [postgres, nats]

  worker-entity:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    restart: unless-stopped
    command: ["python", "-m", "workers.entity_extractor"]
    environment:
      DATABASE_URL: postgresql+asyncpg://rag_app:ragapppassword@postgres:5432/ragdb
      HUGEGRAPH_URL: http://hugegraph:8080
      NATS_URL: nats://nats:4222
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master}
    networks: [rag-net]
    depends_on: [postgres, hugegraph, nats, litellm]

  # ─────────────────────────────────────────────
  # Next.js Frontend — arm64 native
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      platforms:
        - linux/arm64
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8001
      - BACKEND_URL=http://backend:8001
      - LITELLM_URL=http://litellm:4000
      - LITELLM_API_KEY=sk-litellm-master
      - DATABASE_URL=postgresql://rag_app:ragapppassword@postgres:5432/ragdb
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-32chars!!}
    ports:
      - "3000:3000"
    networks: [rag-net]
    depends_on: [backend, postgres]
